<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="LogiFlow. Fleet routing platform built on VROOM: nine NestJS microservices over gRPC and WebSockets, n8n automation, a driver app and a dispatcher console. My role: Built the real-time Socket.IO service: JWT handshake checks, offline detection and live route updates. Google OAuth routing in the API gateway for the admin, mobile and web apps. Driver and dispatcher UX in Angular and Ionic; CI/CD to Azure Static Web Apps."><style>text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.h{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace}.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{to{opacity:1}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}.run{stroke-dasharray:160 2300;animation:run 9s linear infinite}@keyframes run{to{stroke-dashoffset:-2460}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EF0D6" stop-opacity=".26"/><stop offset=".55" stop-color="#5EF0D6" stop-opacity="0"/></linearGradient><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#FF7AB6"/><stop offset=".5" stop-color="#7C8CFF"/><stop offset="1" stop-color="#5EF0D6"/></linearGradient></defs><rect x="1" y="1" width="878" height="342" rx="22" fill="#1C1838" stroke="#FFFFFF" stroke-opacity=".12"/><rect x="1" y="1" width="878" height="342" rx="22" fill="url(#cg)"/><rect class="run" style="animation-delay:-5.0s" x="1" y="1" width="878" height="342" rx="22" fill="none" stroke="#5EF0D6" stroke-width="2" filter="url(#gl)"/><text x="28" y="40" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#5EF0D6">TEAM PROJECT · FLEET ROUTING</text><circle class="pulse" cx="852" cy="36" r="5" fill="#5EF0D6"/><text x="840" y="40" text-anchor="end" font-size="12" fill="#5EF0D6">Live on Azure</text><text class="h" x="28" y="80" font-size="32" font-weight="800" fill="url(#tg)">LogiFlow</text><text x="192" y="80" font-size="15" font-style="italic" fill="#F7F4FF" opacity=".85">Real-time routing for Colombian logistics.</text><text x="28" y="108" font-size="13.5" fill="#B3ABD6">Fleet routing platform built on VROOM: nine NestJS microservices over gRPC and</text><text x="28" y="127" font-size="13.5" fill="#B3ABD6">WebSockets, n8n automation, a driver app and a dispatcher console.</text><text x="28" y="158" font-size="11" font-weight="700" letter-spacing="1.6" fill="#5EF0D6">MY ROLE</text><circle cx="33" cy="174" r="2.6" fill="#5EF0D6"/><text x="44" y="178" font-size="13" fill="#F7F4FF">Built the real-time Socket.IO service: JWT handshake checks, offline detection and</text><text x="44" y="196" font-size="13" fill="#F7F4FF">live route updates.</text><circle cx="33" cy="212" r="2.6" fill="#5EF0D6"/><text x="44" y="216" font-size="13" fill="#F7F4FF">Google OAuth routing in the API gateway for the admin, mobile and web apps.</text><circle cx="33" cy="232" r="2.6" fill="#5EF0D6"/><text x="44" y="236" font-size="13" fill="#F7F4FF">Driver and dispatcher UX in Angular and Ionic; CI/CD to Azure Static Web Apps.</text><text class="h" x="28" y="310" font-size="22" font-weight="800" fill="#FF7AB6">9</text><text x="28" y="327" font-size="11" fill="#B3ABD6">microservices · team</text><text class="h" x="164" y="310" font-size="22" font-weight="800" fill="#7C8CFF">245</text><text x="164" y="327" font-size="11" fill="#B3ABD6">story points · team</text><text class="h" x="300" y="310" font-size="22" font-weight="800" fill="#5EF0D6">60</text><text x="300" y="327" font-size="11" fill="#B3ABD6">my commits</text><text class="h" x="436" y="310" font-size="22" font-weight="800" fill="#FF7AB6">2</text><text x="436" y="327" font-size="11" fill="#B3ABD6">monorepos</text><line x1="588" y1="58" x2="588" y2="320" stroke="#FFFFFF" stroke-opacity=".1"/><text x="604" y="70" font-size="11" font-weight="700" letter-spacing="1.6" fill="#B3ABD6">REPOSITORIES</text><rect x="604" y="82" width="252" height="26" rx="13" fill="#5EF0D6" fill-opacity="0.2" stroke="#5EF0D6" stroke-opacity="0.8"/><text x="616" y="99" font-size="12" fill="#F7F4FF" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace">logiflow</text><text x="846" y="99" text-anchor="end" font-size="10.5" font-weight="700" fill="#5EF0D6">mine</text><rect x="604" y="114" width="252" height="26" rx="13" fill="#5EF0D6" fill-opacity="0.2" stroke="#5EF0D6" stroke-opacity="0.8"/><text x="616" y="131" font-size="12" fill="#F7F4FF" font-family="ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace">logiflow-front</text><text x="846" y="131" text-anchor="end" font-size="10.5" font-weight="700" fill="#5EF0D6">mine</text><text x="604" y="164" font-size="11" font-weight="700" letter-spacing="1.6" fill="#B3ABD6">STACK</text><rect x="604" y="174" width="30" height="30" rx="9" fill="#1A1634" stroke="#FFFFFF" stroke-opacity=".14"/><path transform="translate(610.0 180.0) scale(0.7500)" d="M14.131.047c-.173 0-.334.037-.483.087.316.21.49.49.576.806.007.043.019.074.025.117a.681.681 0 0 1 .013.112c.024.545-.143.614-.26.936-.18.415-.13.861.086 1.22a.74.74 0 0 0 .074.137c-.235-1.568 1.073-1.803 1.314-2.293.019-.428-.334-.713-.613-.911a1.37 1.37 0 0 0-.732-.21zM16.102.4c-.024.143-.006.106-.012.18-.006.05-.006.112-.012.161-.013.05-.025.1-.044.149-.012.05-.03.1-.05.149l-.067.142c