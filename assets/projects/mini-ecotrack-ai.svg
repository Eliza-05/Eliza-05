<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 118" width="290" height="118" role="img" aria-label="EcoTrack AI: AI-based daily carbon footprint estimation for small businesses."><style>text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.h{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace}.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{to{opacity:1}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}.run{stroke-dasharray:70 900;animation:run 7s linear infinite}@keyframes run{to{stroke-dashoffset:-970}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C8CFF" stop-opacity=".22"/><stop offset=".7" stop-color="#7C8CFF" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="288" height="116" rx="16" fill="#1C1838" stroke="#FFFFFF" stroke-opacity=".12"/><rect x="1" y="1" width="288" height="116" rx="16" fill="url(#mg)"/><rect class="run" style="animation-delay:-6.3s" x="1" y="1" width="288" height="116" rx="16" fill="none" stroke="#7C8CFF" stroke-width="1.6"/><text class="h" x="18" y="32" font-size="15.5" font-weight="800" fill="#F7F4FF">EcoTrack AI</text><text x="18" y="54" font-size="12" fill="#B3ABD6">AI-based daily carbon footprint</text><text x="18" y="71" font-size="12" fill="#B3ABD6">estimation for small businesses.</text><circle cx="24" cy="98" r="5" fill="#F1E05A"/><text x="35" y="102" font-size="11.5" fill="#B3ABD6">JavaScript</text><circle class="pulse" cx="220" cy="98" r="4.5" fill="#5EF0D6"/><text x="230" y="102" font-size="11.5" font-weight="600" fill="#5EF0D6">Live</text><text x="272" y="32" text-anchor="end" font-size="13" fill="#7C8CFF">↗</text></svg>