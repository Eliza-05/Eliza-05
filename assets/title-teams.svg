<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 70" width="880" height="70" role="img" aria-label="Team Projects"><style>text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.h{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace}.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{to{opacity:1}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.pulse{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}.ln{stroke-dasharray:240;stroke-dashoffset:240;animation:dr 1.2s .2s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#FF7AB6"/><stop offset=".5" stop-color="#7C8CFF"/><stop offset="1" stop-color="#5EF0D6"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;.5 0;0 0" dur="7s" repeatCount="indefinite"/></linearGradient></defs><text class="h" x="4" y="38" font-size="30" font-weight="800" fill="url(#tg)">Team Projects</text><text x="874" y="38" text-anchor="end" font-size="14" fill="#9C93C9">Collaborative platforms and my contributions</text><path class="ln" style="stroke-dasharray:900;stroke-dashoffset:900" d="M4 54 H874" stroke="url(#tg)" stroke-width="2" stroke-opacity=".7" stroke-linecap="round"/></svg>